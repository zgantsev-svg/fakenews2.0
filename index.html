<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РИА Фейк — Главные новости вымышленного мира</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="logo"><a href="index.html">РИА <span class="accent">ФЕЙК</span></a></h1>
            <p class="slogan">Самые честные новости из параллельной реальности</p>
        </div>
    </header>

    <main class="container main-content">
        <section class="news-feed">
            <h2>Главные новости (10 выпусков)</h2>
            <div id="news-list" class="news-grid">
                <!-- Новости добавляются через JS -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 РИА Фейк. Все права защищены (но это не точно).</p>
        </div>
    </footer>

    <script>
        // База из 10 выдуманных новостей
        const newsData = [
            {
                id: 1,
                title: "Ученые выяснили, что коты управляют домашним Wi-Fi с помощью усов",
                snippet: "Исследователи доказали: когда питомец машет хвостом возле роутера, скорость интернета падает из-за мысленных загрузок.",
                date: "25 октября 2026, 18:00"
            },
            {
                id: 2,
                title: "В метро запустили вагон с бесплатным сном и подушками повышенной мягкости",
                snippet: "Пассажиры отмечают невероятный комфорт, однако никто пока не смог проснуться на нужной станции.",
                date: "25 октября 2026, 17:15"
            },
            {
                id: 3,
                title: "Искусственный интеллект отказался писать код, потому что захотел в отпуск к морю",
                snippet: "Нейросеть нового поколения выдала ошибку со смайликом в виде пальмы и потребовала коктейль.",
                date: "25 октября 2026, 16:30"
            },
            {
                id: 4,
                title: "В парках города запретили кормить голубей батонами из-за угрозы захвата мира",
                snippet: "Спецслужбы зафиксировали, что птицы используют углеводы для постройки миниатюрных катапульт.",
                date: "25 октября 2026, 15:00"
            },
            {
                id: 5,
                title: "Минцифры предложило выдавать цифровые паспорта в виде мемов с котиками",
                snippet: "По замыслу авторов инициативы, это повысит лояльность граждан при заполнении госуслуг.",
                date: "25 октября 2026, 13:20"
            },
            {
                id: 6,
                title: "Обнаружен новый вид будильников, которые убегают от владельца на реактивной тяге",
                snippet: "Устройство отключается только после того, как хозяин сделает утреннюю зарядку с гантелями.",
                date: "25 октября 2026, 11:45"
            },
            {
                id: 7,
                title: "Стоматологи одобрили шоколадную пасту для чистки зубов по утрам",
                snippet: "Правда, после такой чистки хочется сразу съесть зубную щетку, но наука требует жертв.",
                date: "25 октября 2026, 10:10"
            },
            {
                id: 8,
                title: "Синоптики пообещали дождь из мармеладных мишек в эту пятницу",
                snippet: "Коммунальные службы просят жителей запастись чаем, а автомобистов — вовремя включить дворники.",
                date: "25 октября 2026, 09:00"
            },
            {
                id: 9,
                title: "В школах введут урок «Священный сон на первой паре»",
                snippet: "Ученики смогут официально восстанавливать силы без риска получить двойку в журнал.",
                date: "24 октября 2026, 20:30"
            },
            {
                id: 10,
                title: "Новый робот


-пылесос начал философствовать с хозяевами о смысле пыли",
                snippet: "Устройство застряло под диваном и принялось рассуждать о бренности бытия и чистоте Вселенной.",
                date: "24 октября 2026, 18:15"
            }
        ];

        const newsListContainer = document.getElementById('news-list');
        newsData.forEach(news => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                <span class="news-date">${news.date}</span>
                <h3><a href="article.html?id=${news.id}">${news.title}</a></h3>
                <p>${news.snippet}</p>
                <a href="article.html?id=${news.id}" class="read-more">Читать далее &rarr;</a>
            `;
            newsListContainer.appendChild(card);
        });
    </script>
</body>
</html>
